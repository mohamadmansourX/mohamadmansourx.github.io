<style>
:root{
 --bg:#EDF1EF;--card:#FFFFFF;--soft:#F4F7F5;--ink:#14231E;--mute:#5B6C66;--line:#D8E0DC;
 --pri:#2B6A52;--hero:#173F32;--hero2:#1F5241;--int:#E0A019;--err:#B3261E;
 --okb:#DCEFE6;--okt:#1E5A43;--wb:#FBEFD2;--wt:#7A5300;--nb:#F3DAD8;--nt:#8A1F17;
 --yt:#8F6206;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
 --bg:#0F1513;--card:#18201D;--soft:#1F2925;--ink:#E6EEEA;--mute:#94A49E;--line:#2A3531;
 --pri:#58AE8C;--hero:#10302A;--hero2:#16403A;--int:#F0B43A;--err:#F2B8B5;
 --okb:#1E3A2F;--okt:#9FD9BF;--wb:#3D3218;--wt:#F0CF83;--nb:#3E2020;--nt:#F2B8B5;--yt:#F0B43A}}
:root[data-theme="dark"]{color-scheme:dark;
 --bg:#0F1513;--card:#18201D;--soft:#1F2925;--ink:#E6EEEA;--mute:#94A49E;--line:#2A3531;
 --pri:#58AE8C;--hero:#10302A;--hero2:#16403A;--int:#F0B43A;--err:#F2B8B5;
 --okb:#1E3A2F;--okt:#9FD9BF;--wb:#3D3218;--wt:#F0CF83;--nb:#3E2020;--nt:#F2B8B5;--yt:#F0B43A}
*{box-sizing:inherit}
html{scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
html[lang=ar] body{font-family:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,Tahoma,sans-serif;line-height:1.7}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.ico{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header / tabs ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;flex:1;min-width:0;color:inherit;text-decoration:none}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--hero);color:#F2F7F4;display:grid;place-items:center;flex:none}
.brand .logo .ico{width:20px;height:20px}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:600;font-size:15px;cursor:pointer;display:flex;gap:6px;align-items:center;min-height:40px}
.tabs{display:flex;gap:4px}
.tabs button{border:0;background:none;color:var(--mute);cursor:pointer;font-weight:600;border-radius:12px;display:flex;align-items:center;gap:8px}
.tabs button .ico{width:20px;height:20px}
.tabs button[aria-selected=true]{color:var(--ink);background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
@media (min-width:900px){
 .tabs{background:var(--soft);padding:4px;border-radius:14px;border:1px solid var(--line)}
 .tabs button{padding:8px 14px;font-size:15px}
}
@media (max-width:899.98px){
 .tabs{position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(4,1fr)}
 .tabs button{flex-direction:column;gap:3px;padding:6px 2px;font-size:12px;white-space:nowrap;min-width:0;overflow:hidden;min-height:52px;justify-content:center}
 .tabs button .ico{width:22px;height:22px}
 .tabs button[aria-selected=true]{color:var(--pri);background:none;box-shadow:none}
 main{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))!important}
}

/* ---------- layout ---------- */
main{max-width:1120px;margin:0 auto;padding:20px 16px 40px}
.view{display:none}.view.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:.4}to{opacity:1}}
.page-h{margin:0 0 18px}
.page-h h1{margin:0;font-size:clamp(24px,3.2vw,32px);line-height:1.2;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
html[lang=ar] .page-h h1{letter-spacing:0}
.page-h p{margin:6px 0 0;color:var(--mute);font-size:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.box h2{margin:0 0 12px;font-size:18px;display:flex;align-items:center;gap:8px}
.box h2 .ico{color:var(--pri)}
.grid2{display:grid;gap:14px}
.grid2>.box{margin:0}
@media (min-width:900px){
 .calc{display:grid;grid-template-columns:400px 1fr;gap:20px;align-items:start}
 .calc .left{position:sticky;top:84px}
 .grid2{grid-template-columns:1fr 1fr;align-items:start}
 .span2{grid-column:1/-1}
}

/* ---------- inputs ---------- */
.q{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;margin:0 0 8px}
.q .n{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--card);display:grid;place-items:center;font-size:12px;flex:none}
.sp{margin-top:18px}
select{width:100%;height:52px;font-size:16px;font-weight:600;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:0 12px;cursor:pointer}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--soft);font-size:22px;font-weight:600;cursor:pointer;flex:none;display:grid;place-items:center}
.stepper button:active{transform:scale(.96)}
.stepper input{flex:1;min-width:0;height:48px;text-align:center;font-size:21px;font-weight:700;background:transparent;border:1px solid var(--line);border-radius:12px}
.hint{font-size:13.5px;color:var(--mute);margin-top:6px;text-align:center}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.presets button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600;cursor:pointer;min-height:36px}
.presets button[aria-pressed=true]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border:0;background:transparent;color:var(--mute);cursor:pointer;border-radius:9px;font-size:15px;font-weight:600;min-height:42px}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),inset 0 0 0 1px var(--line)}
.err{color:var(--err);font-size:14px;margin-top:8px}
.err:empty{display:none}
.warn{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:14px;background:var(--wb);color:var(--wt);border-radius:10px;padding:9px 11px}
.warn[hidden]{display:none}
.warn .ico{margin-top:2px}
input[type=range]{width:100%;accent-color:var(--pri);margin-top:12px;height:28px}

/* lender info */
.info{margin-top:10px;border-radius:12px;background:var(--soft);padding:12px 14px;border:1px solid var(--line)}
.info .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.info .rate{font-size:30px;font-weight:700;line-height:1.1}
.info p{margin:6px 0 0;font-size:14.5px}
.info .who{color:var(--mute);display:flex;gap:6px;align-items:flex-start}
.info .who .ico{margin-top:3px}
.info .srcs{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--pri);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;text-decoration:none}
.chip:hover{border-color:var(--pri)}
.tag{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.ok{background:var(--okb);color:var(--okt)}.wait{background:var(--wb);color:var(--wt)}.no{background:var(--nb);color:var(--nt)}

/* ---------- hero result ---------- */
.hero{background:var(--hero);color:#F2F7F4;border-radius:20px;padding:22px;margin-bottom:14px}
.hero .lbl{font-size:15px;opacity:.8}
.hero .num{font-size:clamp(46px,9vw,68px);font-weight:700;line-height:1.05;margin:4px 0}
.hero .term{font-size:16px;opacity:.9}
.hero .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.hero .row>div{background:rgba(255,255,255,.07);border-radius:12px;padding:10px 12px;min-width:0}
.hero .row span{display:block;font-size:13px;opacity:.78}
.hero .row b{font-size:21px}
.hero .row .inc{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hero .row .inc small{display:block;font-size:12.5px;opacity:.7}
@media (min-width:1100px){.hero .row{grid-template-columns:1fr 1fr 1.2fr}.hero .row .inc{grid-column:auto;display:block}}
.hero .amber{color:#F4C45A}
.hero .fine{font-size:13px;opacity:.72;margin:12px 0 0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.acts button,.acts a{display:inline-flex;align-items:center;gap:7px;border-radius:10px;padding:9px 14px;font-size:14.5px;font-weight:600;cursor:pointer;text-decoration:none;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#F2F7F4;min-height:42px}
.acts button:hover,.acts a:hover{background:rgba(255,255,255,.14)}
.stack{display:flex;height:40px;border-radius:10px;overflow:hidden;margin:16px 0 8px}
.stack div{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;transition:flex-basis .3s}
.stack .i{background:var(--int);color:#1D2B2A}.stack .p{background:var(--pri);color:#fff}
.hero .stack .p{background:#3E9B78}
.key{display:flex;gap:16px;font-size:13.5px;color:var(--mute);flex-wrap:wrap}
.hero .key{color:#CFE0D8}
.key i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.big{font-size:17px;margin:14px 0 0;line-height:1.6}
.big b{font-size:20px}
.y{color:var(--yt)}.g{color:var(--pri)}
.owe{display:flex;justify-content:space-between;font-size:15px;margin-top:14px}
.owebar{height:10px;background:var(--soft);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.owebar div{height:100%;background:var(--ink);transition:width .3s}
details summary{cursor:pointer;font-weight:700;font-size:18px;list-style:none;display:flex;align-items:center;gap:8px}
details summary .ico{color:var(--pri)}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";font-size:22px;color:var(--mute);font-weight:400;margin-inline-start:auto}
details[open] summary::after{content:"−"}
.note{font-size:14px;color:var(--mute);margin:10px 0 0}
.years{display:grid;gap:4px;margin-top:10px}
.yr{display:grid;grid-template-columns:64px 1fr 92px;gap:8px;align-items:center;border-radius:8px;padding:4px 6px;background:none;border:0;font-size:13.5px;text-align:start;cursor:pointer;min-height:30px}
.yr:hover{background:var(--soft)}
.yr[aria-current=true]{background:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}
.yr .bar{display:flex;height:16px;border-radius:4px;overflow:hidden}
.yr .bar .i{background:var(--int)}.yr .bar .p{background:var(--pri)}
.yr small{color:var(--mute);text-align:end}

/* ---------- banks ---------- */
.bank{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.bank .name{font-weight:700;font-size:18px}
.bank .rate{font-size:30px;font-weight:700;text-align:end;line-height:1}
.bank .sub{grid-column:1/-1;font-size:14px;color:var(--mute);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.use{grid-column:1/-1;justify-self:start;margin-top:6px;font-size:15px;font-weight:600;border:0;background:var(--ink);color:var(--card);border-radius:10px;padding:9px 16px;cursor:pointer;min-height:42px}
.cmp{display:grid;gap:12px}
.cmp .row{display:grid;grid-template-columns:128px 1fr;gap:12px;align-items:center;font-size:14px}
.cmp .row span{color:var(--mute);font-size:13px}
.cmp .track{display:flex;height:28px;border-radius:7px;overflow:hidden}
.cmp .track div{display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden}
.cmp .p{background:var(--pri);color:#fff}.cmp .i{background:var(--int);color:#1D2B2A}
@media (max-width:599.98px){.cmp .row{grid-template-columns:1fr;gap:4px}.cmp .row br{display:none}.cmp .row span{margin-inline-start:6px}}

/* ---------- info pages ---------- */
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:600px){.facts{grid-template-columns:repeat(3,1fr)}}
.fact{background:var(--soft);border-radius:12px;padding:12px}
.fact b{display:block;font-size:22px;line-height:1.2}
.fact span{font-size:13px;color:var(--mute)}
.list{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.list li{display:grid;grid-template-columns:30px 1fr;font-size:15.5px;align-items:start}
.list li .ico{color:var(--pri);margin-top:3px}
.tl{list-style:none;margin:0;padding:0;padding-inline-start:20px;border-inline-start:3px solid var(--line);display:grid;gap:14px}
.tl li{position:relative;font-size:15px}
.tl li::before{content:"";position:absolute;inset-inline-start:-28px;top:6px;width:13px;height:13px;border-radius:50%;background:var(--card);border:3px solid var(--pri)}
.tl li.new::before{background:var(--pri)}
.tl time{display:block;font-weight:700;font-size:13.5px;color:var(--mute)}
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px;font-weight:600}
.flow span{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:inline-flex;gap:6px;align-items:center}
.flow span .ico{color:var(--pri)}
.flow i{font-style:normal;color:var(--mute)}
.verdict{display:flex;gap:12px;align-items:flex-start}
.verdict .v{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.verdict .v .ico{width:22px;height:22px}
.verdict .v.yes{background:var(--okb);color:var(--okt)}.verdict .v.maybe{background:var(--wb);color:var(--wt)}
.verdict p{margin:0}
.srcl{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.srcl a{color:var(--pri);font-weight:600;text-decoration:none;display:inline-flex;gap:6px;align-items:flex-start}
.srcl a .ico{margin-top:3px}
.srcl a:hover{text-decoration:underline}
.srcl small{display:block;color:var(--mute);font-size:13px;padding-inline-start:26px}
.foot{text-align:center;font-size:13px;color:var(--mute);margin-top:20px}
.foot a{color:inherit}
.toast{position:fixed;inset-inline:0;bottom:calc(96px + env(safe-area-inset-bottom,0px));margin:0 auto;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-weight:600;font-size:15px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.2)}
@media (min-width:900px){.toast{bottom:24px}}
@media (prefers-reduced-motion:reduce){.stack div,.owebar div{transition:none}.view.on{animation:none}}
</style></head>

}

function termStr(n){const y=Math.floor(n/12),m=n%12;return [y?`${y} ${t('yr')}`:'',m?`${m} ${t('mo')}`:''].filter(Boolean).join(' + ');}
function build(){
 const P=Math.max(0,+$('amt').value||0),r=Math.max(0,+$('rate').value||0)/1200;let M,err='';
 if(mode==='years'){const n=Math.min(40,Math.max(1,+$('yrs').value||1))*12;M=r?P*r/(1-Math.pow(1+r,-n)):P/n;}
 else{M=+$('pay').value||0;if(P>0&&M<=P*r)err=lang==='ar'?`القسط منخفض جداً: يجب أن يتجاوز ${f0(P*r+1)} شهرياً وإلا لن ينخفض الدين.`:`Too low: pay more than ${f0(P*r+1)}/month or the debt never goes down.`;}
 $('err').textContent=err;rows=[];
 if(!err&&P>0&&M>0){let B=P;for(let m=1;B>0.005&&m<=1200;m++){const i=B*r;const p=Math.min(M-i,B);B-=p;rows.push({m,i,p,pay:i+p,B});}}
 $('amtHint').textContent=P?f0(P):'';
 qa('#amtPre button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.v===P));
 render();termWarn();syncURL();
}
function termWarn(){

 $('termWarn').hidden=!over;if(over)$('termWarnTxt').textContent=L(lender.maxNote);
}
function render(){
 const n=rows.length;
 if(!n){['hPay','hTotV','hIntV','hIncV'].forEach(k=>$(k).textContent='–');$('hTerm').textContent='';$('mText').textContent='';$('years').innerHTML='';$('dP').textContent=$('dI').textContent='';shareLinks();return;}
 const P=rows[0].B+rows[0].p,tI=rows.reduce((s,x)=>s+x.i,0),tot=P+tI;
 $('hPay').textContent=f0(rows[0].pay);
 $('hTerm').textContent=`${t('forW')} ${termStr(n)}`;
 $('hTotV').textContent=f0(tot);$('hIntV').textContent=f0(tI);
 $('hIncV').textContent='≥ '+f0(rows[0].pay/0.33)+t('perMo');
 $('dP').style.flexBasis=100*P/tot+'%';$('dI').style.flexBasis=100*tI/tot+'%';
 $('dP').textContent=P/tot>.16?f0(P):'';$('dI').textContent=tI/tot>.14?f0(tI):'';
 [$('mon'),$('monR')].forEach(e=>e.max=n);if(+$('mon').value>n)$('mon').value=n;if(+$('mon').value<1)$('mon').value=1;
 years();month();shareLinks();
}
function month(){
 const k=+$('mon').value,x=rows[k-1];if(!x)return;$('monR').value=k;const P=rows[0].B+rows[0].p;const y=Math.ceil(k/12);
 $('mText').innerHTML=lang==='ar'
  ?`الشهر <b>${k}</b> · السنة ${y} — من قسطك البالغ <bdi dir="ltr">${f0(x.pay)}</bdi>:<br><span class="y"><b><bdi dir="ltr">${f0(x.i)}</bdi></b> تذهب للمصرف (فائدة)</span><br><span class="g"><b><bdi dir="ltr">${f0(x.p)}</bdi></b> تُسدِّد من دينك</span>`
  :`Month <b>${k}</b> · year ${y} — of your ${f0(x.pay)}:<br><span class="y"><b>${f0(x.i)}</b> goes to the bank (interest)</span><br><span class="g"><b>${f0(x.p)}</b> pays off your debt</span>`;
 const pi=100*x.i/x.pay;$('bI').style.flexBasis=pi+'%';$('bP').style.flexBasis=(100-pi)+'%';
 $('bI').textContent=pi>16?f0(x.i):'';$('bP').textContent=pi<84?f0(x.p):'';
 $('oweV').textContent=f0(x.B);$('oweB').style.width=100*x.B/P+'%';
 qa('.yr').forEach(b=>b.setAttribute('aria-current',+b.dataset.y===y));
}
function years(){
 const n=rows.length,ny=Math.ceil(n/12);let max=0;const Y=[];
 for(let y=1;y<=ny;y++){const s=rows.slice((y-1)*12,y*12);const i=s.reduce((a,x)=>a+x.i,0),p=s.reduce((a,x)=>a+x.p,0);Y.push({y,i,p,B:s[s.length-1].B});max=Math.max(max,i+p);}
 $('years').innerHTML=Y.map(o=>`<button type="button" class="yr" data-y="${o.y}"><span>${t('yearW')} ${o.y}</span><span class="bar" style="width:${100*(o.i+o.p)/max}%"><span class="i" style="flex-basis:${100*o.i/(o.i+o.p)}%"></span><span class="p" style="flex-basis:${100*o.p/(o.i+o.p)}%"></span></span><small dir="ltr">${f0(o.B)}</small></button>`).join('');
 qa('.yr').forEach(b=>b.onclick=()=>{$('mon').value=(+b.dataset.y-1)*12+1;month();$('mon').scrollIntoView({behavior:'smooth',block:'center'});});
}
qa('[data-t]').forEach(b=>b.onclick=()=>{

 el.value=Math.round(v*100)/100;b.dataset.t==='mon'?month():build();

$('monR').oninput=()=>{$('mon').value=$('monR').value;month();};

document.querySelector('[data-go]').onclick=e=>{e.preventDefault();go('calc');};
document.querySelector('.tabs').addEventListener('keydown',e=>{
 const ids=['calc','banks','hab','pch'];let i=ids.indexOf(view);const rtl=document.documentElement.dir==='rtl';
 if(e.key==='ArrowRight')i+=rtl?-1:1;else if(e.key==='ArrowLeft')i+=rtl?1:-1;else if(e.key==='Home')i=0;else if(e.key==='End')i=3;else return;
 e.preventDefault();go(ids[(i+4)%4],true);});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(['calc','banks','hab','pch'].includes(h))go(h);});

/* ---------------- other views ---------------- */
function renderBanks(){
 $('bankCards').innerHTML=BANKS.map(b=>{const tg=TAG[b.tag],s=SRC[b.src];return `<div class="box bank"><div class="name">${L(b.name)}</div><div class="rate" dir="ltr">${b.rate}</div>
  <div class="sub"><span class="tag ${tg[0]}">${L(tg[1])}</span>${L(b.sub)}</div>
  <div class="sub"><a class="chip" target="_blank" rel="noopener" href="${s.u}">${ic('link')}${L(s.l)}</a></div>
  ${b.id?`<button type="button" class="use" data-id="${b.id}">${t('use')}</button>`:''}</div>`}).join('');
 qa('.use').forEach(b=>b.onclick=()=>{lender=LENDERS.find(l=>l.id===b.dataset.id);$('lender').value=lender.id;if(mode!=='years')setMode('years');$('yrs').value=20;$('amt').value=100000;$('mon').value=1;showInfo();build();go('calc');});
 const pay=(P,rt,y)=>{const r=rt/1200,n=y*12;return P*r/(1-Math.pow(1+r,-n))};
 const opts=[[3.5,20,{en:'PCH',ar:'المؤسسة'}],[5.75,20,{en:'Habitat',ar:'الإسكان'}],[5.75,30,{en:'Habitat',ar:'الإسكان'}],[8,20,{en:'Bank of Beirut',ar:'بنك بيروت'}]];
 const d=opts.map(([r,y,n])=>{const m=pay(1e5,r,y);return{r,y,n,m,i:m*y*12-1e5}});const max=Math.max(...d.map(x=>1e5+x.i));
 $('cmp').innerHTML=d.map(x=>`<div class="row"><div><b dir="ltr">${f0(x.m)}</b>${t('perMo')}<br><span>${L(x.n)} · ${x.r}% · ${x.y} ${t('yr')}</span></div><div class="track" style="width:${100*(1e5+x.i)/max}%"><div class="p" style="flex-basis:${1e7/(1e5+x.i)}%"><bdi dir="ltr">$100k</bdi></div><div class="i" style="flex-basis:${100*x.i/(1e5+x.i)}%"><bdi dir="ltr">+${f0(x.i/1000)}k</bdi></div></div></div>`).join('');
}
const factsHTML=a=>a.map(([v,l])=>`<div class="fact"><b>${/[؀-ۿ]/.test(L(v))?L(v):'<bdi dir="ltr">'+L(v)+'</bdi>'}</b><span>${L(l)}</span></div>`).join('');
const listHTML=a=>a.map(([i,l])=>`<li>${ic(i)}<span>${L(l)}</span></li>`).join('');
const tlHTML=a=>a.map(([n,d,l])=>`<li${n?' class="new"':''}><time>${L(d)}</time>${L(l)}</li>`).join('');
const srcHTML=a=>a.map(k=>`<li><a target="_blank" rel="noopener" href="${SRC[k].u}">${ic('link')}<span>${L(SRC[k].l)}</span></a><small>${L(SRC[k].d)}</small></li>`).join('');
function renderInfo(){
 $('habFacts').innerHTML=factsHTML(HAB.facts);$('habRules').innerHTML=listHTML(HAB.rules);$('habTl').innerHTML=tlHTML(HAB.tl);$('habSrc').innerHTML=srcHTML(HAB.src);
 $('pchFacts').innerHTML=factsHTML(PCH.facts);$('pchPts').innerHTML=listHTML(PCH.pts);$('pchTl').innerHTML=tlHTML(PCH.tl);$('pchSrc').innerHTML=srcHTML(PCH.src);
 $('flow').innerHTML=PCH.flow.map(([i,x])=>`<span>${ic(i)}${L(x)}</span>`).join(`<i>${lang==='ar'?'←':'→'}</i>`);
}
function renderPresets(){
 $('amtPre').innerHTML=PRESETS.map(v=>`<button type="button" data-v="${v}" dir="ltr">$${v/1000}k</button>`).join('');
 qa('#amtPre button').forEach(b=>b.onclick=()=>{$('amt').value=b.dataset.v;build();});
}

/* ---------------- language ---------------- */
function applyLang(){
 document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
 qa('[data-i]').forEach(e=>e.innerHTML=t(e.dataset.i));
 qa('[data-a]').forEach(e=>e.setAttribute('aria-label',t(e.dataset.a)));
 $('langTxt').textContent=lang==='ar'?'English':'العربية';
 $('langBtn').setAttribute('aria-label',lang==='ar'?'Switch to English':'التبديل إلى العربية');
 document.title=lang==='ar'?'دليل القرض السكني':'Housing loan helper';
 fillSelect();showInfo();renderPresets();renderBanks();renderInfo();
 if(mode==='pay'){$('mYears').setAttribute('aria-pressed',false);$('mPay').setAttribute('aria-pressed',true);$('yearsBox').hidden=true;$('payBox').hidden=false;}
 build();
}
$('langBtn').onclick=()=>{lang=lang==='ar'?'en':'ar';try{localStorage.setItem('loanLang',lang)}catch(e){}applyLang();};
if(matchMedia('(min-width:900px)').matches)$('yby').open=true;
applyLang();
if(view!=='calc')go(view);
</script>
</body></html>
